allowBuilds:
  sharp: true

minimumReleaseAgeExclude:
  - eslint-plugin-react-refresh@0.5.5
  - knip@6.32.3

shellEmulator: true
trustPolicy: no-downgrade

# semver@6.3.1 is a pinned transitive of @babel/core (via babel-plugin-react-compiler).
# It predates npm trusted publishing, so it carries a registry signature but no build
# attestation, which no-downgrade reads as a trust downgrade relative to semver@7.x.
# The tarball integrity matches the registry exactly; excluded until Babel drops semver@6.
trustPolicyExclude:
  - semver@6.3.1

# eslint-plugin-jsx-a11y@6.10.2 is the latest release and predates ESLint 10, so its
# peer range still tops out at ^9. Verified working on ESLint 10.9.1: alt-text and
# anchor-is-valid both fire correctly. Drop this once upstream widens the range.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
